name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12.7'
  NODE_VERSION: '20.20.2'

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -e "backend[dev,evaluation]"

      - name: Generate deterministic evaluation dataset
        run: python -m evaluation.generate_dataset --seed 42 --output-dir evaluation

      - name: Validate evaluation dataset
        run: >-
          python -c "from pathlib import Path; from evaluation.validator import
          validate_dataset; print(validate_dataset(Path('evaluation')))"

      - name: Run backend tests
        run: python -m pytest -q

      - name: Ruff lint
        run: python -m ruff check backend

      - name: Ruff format check
        run: python -m ruff format --check backend

      - name: Backend Pyright
        run: python -m pyright backend

      - name: Evaluation Pyright
        run: python -m pyright

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest tests
        run: npm test

      - name: Run Vitest coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error
          retention-days: 7

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Chromium suite
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-diagnostics
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install Python dependency sets and pip-audit
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -e "backend[dev,evaluation]"
          python -m pip install pip-audit==2.10.1

      - name: Audit local Python development/evaluation environment
        run: python -m pip_audit --local --format=columns

      - name: Build API runtime image for audit
        run: docker build --tag invoiceflow-api-ci ./backend

      - name: Audit resolved API runtime image
        run: >-
          docker run --rm invoiceflow-api-ci sh -c
          "python -m pip install --no-cache-dir pip-audit==2.10.1
          && pip-audit --local --format=columns"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit complete frontend dependency tree
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  infrastructure-validation:
    name: Infrastructure validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      POSTGRES_DB: invoiceflow_ci
      POSTGRES_USER: invoiceflow_ci
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_URL: postgresql+psycopg://invoiceflow_ci:ci-only-password@db:5432/invoiceflow_ci
      GROQ_API_KEY: ''
      N8N_WEBHOOK_SECRET: ''
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      POSTGRES_DB: postgres
      POSTGRES_USER: invoiceflow_ci
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_URL: postgresql+psycopg://invoiceflow_ci:ci-only-password@localhost:5432/invoiceflow_migrations
      TEST_DATABASE_URL: postgresql+psycopg://invoiceflow_ci:ci-only-password@localhost:5432/invoiceflow_tests
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: invoiceflow_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceflow_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install -e "backend[dev,evaluation]"

      - name: Create isolated migration and test databases
        run: >-
          python -c "import psycopg; connection = psycopg.connect('host=localhost
          port=5432 dbname=postgres user=invoiceflow_ci password=ci-only-password');
          connection.autocommit = True; connection.execute('CREATE DATABASE
          invoiceflow_migrations'); connection.execute('CREATE DATABASE
          invoiceflow_tests'); connection.close()"

      - name: Generate deterministic evaluation dataset
        run: python -m evaluation.generate_dataset --seed 42 --output-dir evaluation

      - name: Validate evaluation dataset
        run: >-
          python -c "from pathlib import Path; from evaluation.validator import
          validate_dataset; print(validate_dataset(Path('evaluation')))"

      - name: Verify Alembic migrations on clean PostgreSQL
        working-directory: backend
        run: alembic upgrade head

      - name: Verify migrated PostgreSQL schema
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: python -m pytest backend/tests/test_migration_smoke.py -q

      - name: Run full suite against PostgreSQL
        run: |
          python -m pytest --ignore=backend/tests/test_live_groq.py \
            --ignore=backend/tests/test_migration_smoke.py \
            --junitxml=postgres-integration.xml -q
          python -c "import xml.etree.ElementTree as ET; root = ET.parse('postgres-integration.xml').getroot(); suites = [root] if root.tag == 'testsuite' else root.findall('testsuite'); skipped = sum(int(s.attrib.get('skipped', '0')) for s in suites); raise SystemExit(f'PostgreSQL integration tests skipped: {skipped}') if skipped else None"

      - name: Upload PostgreSQL integration report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: postgres-integration-report
          path: postgres-integration.xml
          if-no-files-found: error
          retention-days: 7
